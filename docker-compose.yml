name: cutstorm

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    volumes:
      - /home/behrooz/vosk-model-fa-0.42:/models/vosk/fa-0.42:ro
      - ./data:/data
    environment:
      VOSK_FA_MODEL_PATH: /models/vosk/fa-0.42
      # Default model is loaded into RAM on container startup (warmup).
      # Must match what the frontend requests by default so the first
      # transcribe hits cached model.
      WHISPER_MODEL: large-v3
      WHISPER_COMPUTE: int8
      WHISPER_DEVICE: cpu
      MAX_UPLOAD_BYTES: "107374182400"

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    volumes:
      - /home/behrooz/vosk-model-fa-0.42:/models/vosk/fa-0.42:ro
      - ./data:/data
    environment:
      VOSK_FA_MODEL_PATH: /models/vosk/fa-0.42
      WHISPER_MODEL: tiny
      WHISPER_COMPUTE: int8
      WHISPER_DEVICE: cpu
      WHISPERX_SKIP_ALIGN: "1"
    command: ["/scripts/docker-test.sh"]
